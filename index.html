<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd9ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>✨ Nail Salon ✨</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💅</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Vendored from minormending/kidsuite; see suite/. Loaded after this game's
       own stylesheet so the shared rules settle any tie with it. -->
  <link rel="stylesheet" href="suite/landing.css" />
</head>
<body class="is-landing">
  <div id="backdrop" aria-hidden="true"></div>

  <!-- The front door, the same one the other games open on. It renders in
       here; markup and fade come from suite/landing.js. The tap is also what
       lets WebAudio run, so the first chime is not silent on iOS. -->
  <div id="door" class="landing-screen"></div>
  <div id="app">
    <header id="topbar">
      <h1 class="title">✨ Nail Salon ✨</h1>
      <div class="topbar-buttons">
        <button id="surface-btn" class="icon-btn" type="button" aria-label="Switch between hand and foot" title="Hand or foot">✋</button>
        <button id="sound-btn" class="icon-btn" type="button" aria-label="Turn sound on or off" title="Sound">🔊</button>
        <button id="save-btn" class="icon-btn" type="button" aria-label="Save a picture" title="Save a picture">📸</button>
        <button id="reset-btn" class="icon-btn" type="button" aria-label="Start over" title="Start over">🧼</button>
      </div>
    </header>

    <main id="stage">
      <!-- The salon scene, hand, and foot are drawn here by js/game.js -->
      <div id="hand-wrap"></div>
      <!-- Sparkle animations pop up here -->
      <div id="sparkle-layer" aria-hidden="true"></div>
    </main>

    <footer id="tray">
      <!-- Category tabs: Colors / Stickers / Shapes / Skin / Eraser -->
      <div id="tabs" class="tab-row" role="tablist" aria-label="Tools"></div>
      <!-- Options for the chosen tab -->
      <div id="panel" class="panel" aria-label="Options"></div>
    </footer>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="suite/landing.js"></script>
  <script src="js/game.js" defer></script>
</body>
</html>
