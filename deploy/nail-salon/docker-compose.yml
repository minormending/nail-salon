# Nail Salon — runs behind the shared gateway on /nail-salon/.
#
# Single static-file container. Attaches to `gateway_nailsalon` so the gateway
# Caddy can reach it by container name. No host ports are bound.
#
# `IMAGE_TAG` MUST be set (no `:latest` fallback) so a missing .env fails loudly
# instead of silently deploying a stale image.
services:
  nail-salon-web:
    image: ghcr.io/${GH_REPO}:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: nail-salon-web
    restart: unless-stopped
    networks:
      - gateway
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

networks:
  gateway:
    name: gateway_nailsalon
    external: true
