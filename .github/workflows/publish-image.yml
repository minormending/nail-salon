# Build the static-site image and push it to GHCR.
#
# This repo only *publishes* the image; applying it on the droplet is done
# separately via the emblem-do MCP (`pull_and_up`). So there is no SSH/deploy
# job here and no droplet secrets are needed — only the built-in GITHUB_TOKEN
# with packages:write.
name: publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: repo
        run: echo "lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is already pushed above; a scan finding won't unpublish it,
      # it just flags the run. Mirrors the other apps' pipeline.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lc }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - name: Upload trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
        continue-on-error: true
